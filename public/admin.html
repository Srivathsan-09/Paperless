<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paperless - Admin Panel</title>
    <link rel="icon" type="image/png" href="Logo2.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #f5f5f5;
            color: #333;
            line-height: 1.6;
        }

        .admin-container {
            display: grid;
            grid-template-columns: 250px 1fr;
            min-height: 100vh;
        }

        .sidebar {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
        }

        .sidebar h2 {
            margin-bottom: 30px;
            font-size: 1.5rem;
        }

        .sidebar nav button {
            display: block;
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            font-size: 0.95rem;
            transition: background 0.3s;
        }

        .sidebar nav button:hover,
        .sidebar nav button.active {
            background: rgba(255, 255, 255, 0.4);
        }

        .main-content {
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .header h1 {
            font-size: 2rem;
            color: #333;
        }

        .search-box {
            display: flex;
            gap: 10px;
        }

        .search-box input {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            width: 250px;
            font-size: 0.95rem;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-danger {
            background: #ef5350;
            color: white;
        }

        .btn-danger:hover {
            background: #e53935;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .user-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .user-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .user-card h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .user-card p {
            margin: 8px 0;
            font-size: 0.9rem;
            color: #666;
        }

        .user-card .stat {
            display: inline-block;
            padding: 8px 12px;
            background: #f0f0f0;
            border-radius: 4px;
            margin-right: 8px;
            margin-top: 8px;
            font-size: 0.85rem;
        }

        .user-profile {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .profile-info {
            flex: 1;
        }

        .profile-info h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h4 {
            font-size: 0.9rem;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .stat-card .value {
            font-size: 1.8rem;
            font-weight: 600;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th {
            background: #f5f5f5;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #e0e0e0;
        }

        table td {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        table tr:hover {
            background: #f9f9f9;
        }

        .chart-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .filter-row {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-row input,
        .filter-row select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 2rem;
            cursor: pointer;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .spinner {
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .admin-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: flex;
                flex-direction: column;
                position: fixed;
                left: 0;
                top: 0;
                height: 100vh;
                z-index: 999;
                transform: translateX(-100%);
                transition: transform 0.3s;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .users-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <div class="admin-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>🔐 Admin Panel</h2>
            <nav>
                <button onclick="showSection('dashboard')" class="nav-btn active">Dashboard</button>
                <button onclick="showSection('users')" class="nav-btn">Users</button>
                <button onclick="showSection('data-explorer')" class="nav-btn">Data Explorer</button>
                <button onclick="showSection('export')" class="nav-btn">Export</button>
                <button onclick="logout()" class="nav-btn">Logout</button>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Dashboard Section -->
            <div id="dashboard" class="section active">
                <div class="header">
                    <h1>Dashboard</h1>
                </div>

                <div class="stats-grid" id="dashboardStats">
                    <div class="stat-card">
                        <h4>Total Users</h4>
                        <div class="value" id="totalUsers">-</div>
                    </div>
                    <div class="stat-card">
                        <h4>Total Entries</h4>
                        <div class="value" id="totalEntries">-</div>
                    </div>
                    <div class="stat-card">
                        <h4>Total Spending</h4>
                        <div class="value" id="totalSpending">₹-</div>
                    </div>
                    <div class="stat-card">
                        <h4>Avg User Spending</h4>
                        <div class="value" id="avgSpending">₹-</div>
                    </div>
                </div>
            </div>

            <!-- Users Section -->
            <div id="users" class="section">
                <div class="header">
                    <h1>Users</h1>
                    <div class="search-box">
                        <input type="text" id="userSearch" placeholder="Search users..." onkeyup="searchUsers()">
                        <button class="btn btn-primary" onclick="loadUsers()">Refresh</button>
                    </div>
                </div>

                <div id="usersContainer" class="users-grid">
                    <div class="loading">Loading users...</div>
                </div>

                <div id="usersPagination" class="pagination"></div>
            </div>

            <!-- Data Explorer Section -->
            <div id="data-explorer" class="section">
                <div class="header">
                    <h1>Data Explorer</h1>
                </div>

                <div style="background: white; padding: 20px; border-radius: 10px;">
                    <p>Select a user to explore their data:</p>
                    <input type="text" id="explorerSearch" placeholder="Search users..." style="width: 100%; max-width: 300px; margin: 15px 0;" onkeyup="searchExplorerUsers()">
                    <div id="explorerUsersList" class="users-grid"></div>
                </div>

                <div id="userDataExplorer" style="display: none; margin-top: 30px;"></div>
            </div>

            <!-- Export Section -->
            <div id="export" class="section">
                <div class="header">
                    <h1>Export Data</h1>
                </div>

                <div style="background: white; padding: 20px; border-radius: 10px;">
                    <h3>Export Options</h3>
                    <div style="margin-top: 20px;">
                        <h4>All Users</h4>
                        <button class="btn btn-primary" onclick="exportAllUsersCSV()" style="margin-top: 10px;">
                            📥 Export Users as CSV
                        </button>
                    </div>

                    <div style="margin-top: 30px;">
                        <h4>User-Specific Exports</h4>
                        <input type="text" id="exportUserSearch" placeholder="Search user to export..." style="width: 100%; max-width: 300px; margin: 15px 0;">
                        <div id="exportUsersList" class="users-grid" style="max-height: 400px; overflow-y: auto;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- User Profile Modal -->
    <div id="userProfileModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>User Profile</h2>
                <button class="close-btn" onclick="closeModal('userProfileModal')">&times;</button>
            </div>
            <div id="userProfileContent"></div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/admin';
        let authToken = localStorage.getItem('authToken');
        let currentPage = 1;
        let currentLimit = 20;
        let currentSearch = '';

        // ===== INITIALIZATION =====

        window.addEventListener('load', () => {
            checkAuth();
            loadDashboard();
            loadUsers();
        });

        function checkAuth() {
            if (!authToken) {
                window.location.href = 'Loginpage.html';
                return;
            }

            // Verify admin access by making an API call
            fetch(`${API_BASE}/users?page=1&limit=1`, {
                headers: {
                    'Authorization': `Bearer ${authToken}`
                }
            })
            .catch(() => {
                localStorage.removeItem('authToken');
                window.location.href = 'Loginpage.html';
            });
        }

        function logout() {
            localStorage.removeItem('authToken');
            window.location.href = 'Loginpage.html';
        }

        // ===== SECTION MANAGEMENT =====

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (sectionId === 'users') {
                loadUsers();
            } else if (sectionId === 'data-explorer') {
                loadExplorerUsers();
            } else if (sectionId === 'export') {
                loadExportUsers();
            }
        }

        // ===== DASHBOARD =====

        async function loadDashboard() {
            try {
                const response = await fetch(`${API_BASE}/users?page=1&limit=1000`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Failed to load users');

                const data = await response.json();
                const users = data.users || [];

                let totalUsers = data.pagination.total;
                let totalEntries = 0;
                let totalSpending = 0;

                users.forEach(user => {
                    totalEntries += user.entryCount || 0;
                    totalSpending += user.totalSpending || 0;
                });

                document.getElementById('totalUsers').textContent = totalUsers;
                document.getElementById('totalEntries').textContent = totalEntries;
                document.getElementById('totalSpending').textContent = `₹${totalSpending.toLocaleString()}`;
                document.getElementById('avgSpending').textContent = `₹${(totalUsers > 0 ? Math.round(totalSpending / totalUsers) : 0).toLocaleString()}`;
            } catch (err) {
                console.error('Error loading dashboard:', err);
            }
        }

        // ===== USERS SECTION =====

        async function loadUsers(page = 1, search = '') {
            try {
                const response = await fetch(`${API_BASE}/users?page=${page}&limit=${currentLimit}&search=${encodeURIComponent(search)}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Failed to load users');

                const data = await response.json();
                const users = data.users || [];

                let html = '';
                users.forEach(user => {
                    html += `
                        <div class="user-card" onclick="viewUserProfile('${user._id}')">
                            <h3>${user.name}</h3>
                            <p><strong>Email:</strong> ${user.email}</p>
                            <p><strong>Registered:</strong> ${new Date(user.createdAt).toLocaleDateString()}</p>
                            <div>
                                <span class="stat">Categories: ${user.categoryCount || 0}</span>
                                <span class="stat">Entries: ${user.entryCount || 0}</span>
                                <span class="stat">₹${(user.totalSpending || 0).toLocaleString()}</span>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('usersContainer').innerHTML = html || '<p>No users found.</p>';

                // Pagination
                let paginationHtml = '';
                for (let i = 1; i <= data.pagination.pages; i++) {
                    paginationHtml += `<button onclick="loadUsers(${i}, '${search}')" class="${i === page ? 'active' : ''}">${i}</button>`;
                }
                document.getElementById('usersPagination').innerHTML = paginationHtml;

                currentPage = page;
            } catch (err) {
                console.error('Error loading users:', err);
                document.getElementById('usersContainer').innerHTML = '<p>Error loading users.</p>';
            }
        }

        function searchUsers() {
            const search = document.getElementById('userSearch').value;
            currentSearch = search;
            loadUsers(1, search);
        }

        // ===== DATA EXPLORER =====

        async function loadExplorerUsers() {
            try {
                const response = await fetch(`${API_BASE}/users?page=1&limit=100`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Failed to load users');

                const data = await response.json();
                const users = data.users || [];

                let html = '';
                users.forEach(user => {
                    html += `
                        <div class="user-card" onclick="exploreUserData('${user._id}')">
                            <h3>${user.name}</h3>
                            <p>${user.email}</p>
                            <div>
                                <span class="stat">${user.categoryCount || 0} categories</span>
                                <span class="stat">${user.entryCount || 0} entries</span>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('explorerUsersList').innerHTML = html;
            } catch (err) {
                console.error('Error loading explorer users:', err);
            }
        }

        function searchExplorerUsers() {
            const search = document.getElementById('explorerSearch').value;
            const cards = document.querySelectorAll('#explorerUsersList .user-card');
            cards.forEach(card => {
                const text = card.textContent.toLowerCase();
                card.style.display = text.includes(search.toLowerCase()) ? '' : 'none';
            });
        }

        async function exploreUserData(userId) {
            try {
                const response = await fetch(`${API_BASE}/users/${userId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Failed to load user data');

                const data = await response.json();
                const user = data.user;
                const stats = data.stats;

                let html = `
                    <div class="user-profile">
                        <div class="profile-header">
                            <div class="profile-info">
                                <h2>${user.name}</h2>
                                <p>${user.email}</p>
                                <p>Registered: ${new Date(user.createdAt).toLocaleDateString()}</p>
                            </div>
                            <div class="export-buttons">
                                <button class="btn btn-primary" onclick="exportUserJSON('${userId}')">📥 JSON</button>
                                <button class="btn btn-primary" onclick="exportUserCSV('${userId}')">📥 CSV</button>
                            </div>
                        </div>

                        <div class="stats-grid">
                            <div class="stat-card">
                                <h4>Categories</h4>
                                <div class="value">${stats.categoryCount}</div>
                            </div>
                            <div class="stat-card">
                                <h4>Entries</h4>
                                <div class="value">${stats.entryCount}</div>
                            </div>
                            <div class="stat-card">
                                <h4>Total Spending</h4>
                                <div class="value">₹${stats.totalSpending.toLocaleString()}</div>
                            </div>
                            <div class="stat-card">
                                <h4>Average Amount</h4>
                                <div class="value">₹${Math.round(stats.averageAmount).toLocaleString()}</div>
                            </div>
                        </div>

                        <div class="table-container" style="margin-top: 30px;">
                            <h3 style="padding: 15px; background: #f5f5f5;">Top Spending Categories</h3>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Category</th>
                                        <th>Total Spending</th>
                                        <th>Percentage</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${stats.topCategories.map(cat => `
                                        <tr>
                                            <td>${cat.categoryName}</td>
                                            <td>₹${cat.total.toLocaleString()}</td>
                                            <td>${cat.percentage}%</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>

                        <div class="table-container">
                            <h3 style="padding: 15px; background: #f5f5f5;">Monthly Spending Trend</h3>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Month</th>
                                        <th>Total</th>
                                        <th>Entries</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${stats.monthlyTrend.map(m => `
                                        <tr>
                                            <td>${m.month}</td>
                                            <td>₹${m.total.toLocaleString()}</td>
                                            <td>${m.entryCount}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                document.getElementById('userDataExplorer').innerHTML = html;
                document.getElementById('userDataExplorer').style.display = 'block';
                document.getElementById('explorerUsersList').style.display = 'none';

            } catch (err) {
                console.error('Error loading user data:', err);
            }
        }

        // ===== EXPORT SECTION =====

        async function loadExportUsers() {
            try {
                const response = await fetch(`${API_BASE}/users?page=1&limit=100`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Failed to load users');

                const data = await response.json();
                const users = data.users || [];

                let html = '';
                users.forEach(user => {
                    html += `
                        <div class="user-card">
                            <h3>${user.name}</h3>
                            <p>${user.email}</p>
                            <div style="margin-top: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                                <button class="btn btn-primary" style="flex: 1; min-width: 80px;" onclick="exportUserJSON('${user._id}')">JSON</button>
                                <button class="btn btn-primary" style="flex: 1; min-width: 80px;" onclick="exportUserEntriesCSV('${user._id}')">Entries CSV</button>
                                <button class="btn btn-primary" style="flex: 1; min-width: 80px;" onclick="exportUserCategoriesCSV('${user._id}')">Categories CSV</button>
                            </div>
                        </div>
                    `;
                });

                document.getElementById('exportUsersList').innerHTML = html;
            } catch (err) {
                console.error('Error loading export users:', err);
            }
        }

        function exportAllUsersCSV() {
            window.location.href = `${API_BASE}/export/users/csv`;
        }

        function exportUserJSON(userId) {
            window.location.href = `${API_BASE}/export/${userId}/json`;
        }

        function exportUserCSV(userId) {
            window.location.href = `${API_BASE}/export/${userId}/csv/entries`;
        }

        function exportUserEntriesCSV(userId) {
            window.location.href = `${API_BASE}/export/${userId}/csv/entries`;
        }

        function exportUserCategoriesCSV(userId) {
            window.location.href = `${API_BASE}/export/${userId}/csv/categories`;
        }

        // ===== MODALS =====

        async function viewUserProfile(userId) {
            try {
                const response = await fetch(`${API_BASE}/users/${userId}`, {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });

                if (!response.ok) throw new Error('Failed to load user profile');

                const data = await response.json();
                const user = data.user;
                const stats = data.stats;

                let html = `
                    <div style="margin-bottom: 20px;">
                        <p><strong>Name:</strong> ${user.name}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>Registered:</strong> ${new Date(user.createdAt).toLocaleDateString()}</p>
                        <p><strong>Last Login:</strong> ${new Date(user.lastLogin).toLocaleDateString()}</p>
                    </div>

                    <h4 style="margin-top: 20px; margin-bottom: 10px;">Statistics</h4>
                    <p>Categories: ${stats.categoryCount}</p>
                    <p>Entries: ${stats.entryCount}</p>
                    <p>Total Spending: ₹${stats.totalSpending.toLocaleString()}</p>
                    <p>Average Entry: ₹${Math.round(stats.averageAmount).toLocaleString()}</p>

                    <div style="margin-top: 20px;">
                        <button class="btn btn-primary" onclick="exportUserJSON('${userId}')">📥 Export JSON</button>
                        <button class="btn btn-primary" onclick="exportUserCSV('${userId}')">📥 Export CSV</button>
                    </div>
                `;

                document.getElementById('userProfileContent').innerHTML = html;
                document.getElementById('userProfileModal').classList.add('active');
            } catch (err) {
                console.error('Error loading user profile:', err);
                alert('Error loading user profile');
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('active');
        }

        window.onclick = (event) => {
            const modal = document.getElementById('userProfileModal');
            if (event.target === modal) {
                modal.classList.remove('active');
            }
        };
    </script>
</body>

</html>
